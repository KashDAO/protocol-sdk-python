name: Publish to PyPI

# MANUAL ONLY. Publishing is never automatic — a tag push or merge must
# not upload to PyPI. Trigger this from the Actions tab (or
# `gh workflow run publish-pypi.yml --ref main -f version=<x>`) and type
# the version you intend to publish. The version must match the wheel
# built from the checked-out ref (kashdao_protocol_sdk/_version.py), or
# the run fails before uploading.
#
# Builds the wheel + sdist and uploads to PyPI via OIDC trusted
# publishing — no PyPI API token in the repo.
#
# Setup (one-time on the public mirror):
#   1. Create a "trusted publisher" on PyPI for the project, scoped to
#      `KashDAO/protocol-sdk-python` + this workflow filename + the
#      `pypi` environment.
#   2. No API token needed — the OIDC token issued by GitHub Actions
#      is exchanged for a short-lived PyPI upload credential.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish — must match kashdao_protocol_sdk/_version.py (e.g. 0.1.0b2)'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  build-and-publish:
    name: Build + publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/kashdao-protocol-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.12'

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build wheel + sdist
        run: python -m build

      - name: Verify requested version matches build
        run: |
          # The operator types the version they intend to publish; it
          # must equal the version hatchling baked into the wheel. Guards
          # against dispatching the workflow against the wrong ref.
          want="${{ github.event.inputs.version }}"
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          # kashdao_protocol_sdk-0.1.0b2-py3-none-any.whl → 0.1.0b2
          pkg=$(basename "$wheel" | awk -F- '{print $2}')
          if [ "$want" != "$pkg" ]; then
            echo "Requested version $want does not match built wheel version ($pkg)"
            exit 1
          fi
          echo "Version match: $pkg"

      - name: Publish to PyPI (OIDC trusted publishing)
        # v1.14.2 bundles twine 7.0.0, which accepts Metadata-Version 2.5.
        # v1.12.4 (twine 6.1.0) refused it and blocked 0.2.0b1.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/
          # Skip-existing covers reruns of an already-published version.
          skip-existing: true
